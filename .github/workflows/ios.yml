name: iOS Build (Tauri)

on:
  push:
    branches:
      - ios  # このブランチへの push のみトリガー

jobs:
  init-and-build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Tauri CLI
        run: cargo install tauri-cli --locked

      - name: Install dependencies
        run: npm ci

      - name: Initialize iOS project
        run: cargo tauri ios init

      - name: Build iOS IPA
        run: cargo tauri ios build --release

      - name: Upload IPA
        uses: actions/upload-artifact@v3
        with:
          name: Tauri-iOS-IPA
          path: src-tauri/gen/apple/target/ios/release/*.ipa