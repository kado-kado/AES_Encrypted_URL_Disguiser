name: iOS Build (Tauri) npm CLI

on:
  push:
    branches:
      - ios

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      # ソースコード取得
      - name: Checkout repository
        uses: actions/checkout@v3

      # Node.js / npm 環境
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20
          cache: 'npm'

      # Xcode 環境確認（ライセンス承認）
      - name: Setup Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app
          sudo xcodebuild -license accept

      # Tauri CLI インストール (npm 版)
      - name: Install Tauri CLI
        run: npm install -g @tauri-apps/cli

      # Tauri CLI が PATH にあるか確認
      - name: Check Tauri CLI
        run: which tauri && tauri -V

      # 依存モジュールインストール
      - name: Install dependencies
        run: npm ci

      # iOS プロジェクト初期化
      - name: Initialize iOS project
        run: tauri ios init -v

      # iOS ビルド (Release + 詳細ログ)
      - name: Build iOS IPA
        run: tauri ios build -- --release -v

      # IPA を Artifact として保存
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Tauri-iOS-IPA
          path: src-tauri/gen/apple/target/ios/release/*.ipa